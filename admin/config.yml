              - { label: "Castellano", name: es, widget: string, required: false }
              - { label: "Svenska", name: sv, widget: string, required: false }
              - { label: "English", name: en, widget: string, required: false }
          - label: "Missatge d'enviat correctament"
            name: form_ok
            widget: object
            collapsed: false
            fields:
              - { label: "Català", name: ca, widget: text }
              - { label: "Castellano", name: es, widget: text, required: false }
              - { label: "Svenska", name: sv, widget: text, required: false }
              - { label: "English", name: en, widget: text, required: false }
          - label: "Missatge d'error"
            name: form_error
            widget: object
            collapsed: false
            fields:
              - { label: "Català", name: ca, widget: text }
              - { label: "Castellano", name: es, widget: text, required: false }
              - { label: "Svenska", name: sv, widget: text, required: false }
              - { label: "English", name: en, widget: text, required: false }
      - label: "Menú"
        name: menu
        file: "content/menu.json"
        fields:
          - label: "Qui soc"
            name: nav_about
            widget: object
            collapsed: false
            fields:
              - { label: "Català", name: ca, widget: string }
              - { label: "Castellano", name: es, widget: string, required: false }
